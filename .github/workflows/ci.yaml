name: ci
on: [push, pull_request]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - name: API unit tests
        run: pnpm --filter api test --runInBand
      - run: pnpm -r build

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/data } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  db-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Start postgres with bootstrap
        run: docker compose -f infra/compose.yaml up -d --wait postgres
      # Add a failing-on-error migration smoke check when Step 3 adds Alembic.
      - name: Verify grants
        run: bash infra/postgres/verify-grants.sh
