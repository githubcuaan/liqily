[project]
name = "liqi-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "dnhfan", email = "dinhan.0321@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0",
  "fastapi>=0.142.2",
  "httpx>=0.28.1",
  "mwparserfromhell>=0.7.2",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.1.3",
  "typer>=0.27.2",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
liqi-data = "liqi_data.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "ruff>=0.16.10",
  "types-pyyaml>=6.0.12.20260906",
]
